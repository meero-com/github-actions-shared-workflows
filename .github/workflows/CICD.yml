name: CI + release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

env:
  NODE_VERSION: 20
  PYTHON_VERSION: '3.12'
  
jobs:
  pre-commit:
    name: 'Execute pre-commit rules'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pre-commit rules
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  workflow-validation:
    name: Github Action Workflows validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1
      - uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440  # v1.81.1

  tag-release:
    name: Github release
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs:
      - pre-commit
      - workflow-validation
    permissions:
      contents: write
    outputs:
      released_version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: "Semantic release"
        id: release
        uses: "meero-com/github-actions-shared-workflows/actions/release/semantic@main"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          branch: 'main'
